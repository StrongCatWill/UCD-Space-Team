server:
  port: ${PORT:8080}         # hosting platforms inject PORT

spring:
  application:
    name: fire-backend
  http:
    clients:                 # Boot 4.1 global HTTP client timeouts (used by RestClient)
      connect-timeout: 2s
      read-timeout: 20s      # /accuracy back-tests 30 forecast days; give it time

fire:
  model-api:
    url: ${FIRE_MODEL_API_URL:http://localhost:8000}   # the Python fire-service
    ingest-token: ${INGEST_TOKEN:}
  data:                                                # Colab artifacts copied into resources/data
    calendar: classpath:data/calendar.json
    forecasts: classpath:data/forecasts.json
  refresh:
    enabled: ${FIRE_REFRESH_ENABLED:true}              # daily pull of new satellite data via the Python plugins
    cron: ${FIRE_REFRESH_CRON:0 30 6 * * *}            # no new data -> Python answers updated=false, nothing written
  # POST /api/admin/refresh needs header X-Admin-Token equal to this; empty = endpoint disabled (403)
  admin-token: ${FIRE_ADMIN_TOKEN:}
  # comma-separated; add the deployed frontend origin here, e.g. https://nasa-wildfire.vercel.app
  cors-origins: ${FIRE_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.spaceapps.fire: INFO
