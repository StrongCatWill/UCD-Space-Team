# All column names, paths and model settings. Paths are relative to `root` (relative to this file).
root: ..
seed: 42

paths:
  data: ../out/model/harmonised_cell_month.csv   # D1 pipeline modeltable (synthetic was data/harmonised.parquet)
  climate: null                        # optional climate covariates table; null = model runs without
  artifacts: artifacts
  reports: reports

# Canonical name (left, used in code) -> column name in the harmonised table (right). Edit the right side.
columns:
  cell_id: cell_id
  lat: lat
  lon: lon
  region: country                      # was region (5 deg block, ~100 levels: GLM too slow on real data)
  land_cover: land_cover
  year: year
  month: month
  modis_count: modis_count
  modis_count_terra: modis_count_terra
  modis_count_aqua: modis_count_aqua
  modis_count_high_conf: modis_count_high_conf
  modis_frp_sum: modis_frp_sum
  modis_frp_max: modis_frp_max
  viirs_count: viirs_snpp_count        # S-NPP only: the one VIIRS satellite covering all of 2012-2026
  viirs_frp_sum: viirs_snpp_frp_sum

grid:
  cell_deg: 0.5
  keep_cells_with_any_detection: true

time:
  backcast_years: [2002, 2011]         # MODIS-only years to translate
  viirs_years: [2012, 2025]            # years with observed VIIRS (target present)
  drift_cutoff_year: 2021              # MODIS orbit-drift era flag = year >= this

target: count                          # count (VIIRS detections) | frp (summed VIIRS FRP, MW)

backcast:
  tweedie_power: 1.5                   # used when target = frp
  guard_percentile: 99.9               # per land cover, over MODIS>0 cell-months; beyond it the RF correction shrinks to 0 at 2x
  smearing: true                       # Duan smearing so exp(log-residual) does not under-predict totals
  quantiles: [0.05, 0.5, 0.95]
  rf: {n_estimators: 200, min_samples_leaf: 20, max_features: 0.5, n_jobs: -1}
  qrf: {n_estimators: 200, min_samples_leaf: 20, max_features: 0.5, n_jobs: -1}
  stacked: {enabled: false, inner_folds: 5}   # disabled for the real-data run (comparison only)

validation:
  folds:
    A: {train: [2017, 2025], test: [2012, 2016]}
    B: {train: [2012, 2016], test: [2017, 2025]}
  leave_one_year_out: false            # optional extra: LOYO within viirs_years

forecast:
  lags: [1, 2, 3, 12]
  rolling_test_years: [2021, 2022, 2023, 2024, 2025]   # train <= T-1, test T
  min_backcast_weight: 0.1
  hgb: {max_iter: 300, learning_rate: 0.05, max_leaf_nodes: 31, min_samples_leaf: 40, l2_regularization: 1.0}
  climate_columns: []                  # names in the climate table, joined on cell_id/year/month

synthetic:
  n_cells: 400
  years: [2002, 2026]
  last_month: 10                       # 2026 runs to October (current month excluded)

api:
  cors_origins: ["http://localhost:5173", "http://localhost:3000", "http://localhost:8080"]
  max_batch_rows: 200000
